plugins { id 'fabric-loom' version '1.14.10' }
version = '1.0.0'
group = 'dev.pandabreeder'
base { archivesName = 'panda-breeder' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
test { useJUnitPlatform() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'pandabreeder-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}
tasks.register('sourceBundle', Zip) {
    archiveFileName = "panda-breeder-${project.version}-project.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('.') {
        include 'src/**', 'gradle/**', 'gradlew', 'gradlew.bat', '*.gradle', 'gradle.properties', '.gitignore', '.gitattributes', '.github/**', 'README.md', 'docs/**'
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
